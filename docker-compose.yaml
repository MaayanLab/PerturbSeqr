services:
  perturbseqr-postgres:
    build: db
    image: johnkgardner/perturbseqr-postgres:0.2.45
    pull_policy: if_not_present
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 1Gb
    environment:
      - POSTGRES_PASSWORD
      - ENRICH_URL=http://perturbseqr-enrich:8000
    ports:
      - 5432:5432
    volumes:
      - perturbseqr-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  perturbseqr-enrich:
    build: enrich
    image: johnkgardner/perturbseqr-enrich:0.2.54
    pull_policy: if_not_present
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 5Gb
    environment:
      - ROCKET_DATABASES={postgres={url="postgres://postgres:${POSTGRES_PASSWORD}@perturbseqr-postgres/postgres"}}
      - ENRICH_S3_ENDPOINT
      - ENRICH_S3_BUCKET
      - ENRICH_S3_PREFIX
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      # Temporary AWS credentials only. Leave unset otherwise.
      - AWS_SESSION_TOKEN
    ports:
      - 8000:8000
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy

  perturbseqr-app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_MINIO_URL=${PUBLIC_S3_URL:-https://perturbseqr.s3.amazonaws.com}
    image: johnkgardner/perturbseqr-app:0.2.53
    pull_policy: if_not_present
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - PUBLIC_URL=https://perturbseqr.maayanlab.cloud
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@perturbseqr-postgres/postgres
      - NODE_ENV=production
      - ENRICH_URL=http://perturbseqr-enrich:8000
      - NEXT_PUBLIC_MINIO_URL=${PUBLIC_S3_URL:-https://perturbseqr.s3.amazonaws.com}
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=$NEXT_PUBLIC_GA_MEASUREMENT_ID
    ports:
      - target: 3000
        published: 3000
        x-kubernetes:
          annotations:
            maayanlab.cloud/ingress: https://perturbseqr.maayanlab.cloud
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy

  perturbseqr-mcp:
    build: mcp
    image: johnkgardner/perturbseqr-mcp:0.2.51
    pull_policy: if_not_present
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - PERTURBSEQR_API_URL=http://perturbseqr-app:3000/graphql
    ports:
      - 5000:5000
    x-kubernetes:
      annotations:
        maayanlab.cloud/ingress: https://perturbseqr.maayanlab.cloud/mcp
    depends_on:
      - perturbseqr-app

  dbmate:
    image: ghcr.io/amacneil/dbmate
    restart: "no"
    volumes:
      - ./db/migrations:/db/migrations:ro
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@perturbseqr-postgres/postgres?sslmode=disable
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy
    command: ["up"]
    profiles: [jobs]

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: johnkgardner/perturbseqr-ingest:0.2.54
    pull_policy: if_not_present
    platform: linux/amd64
    restart: "no"
    x-kubernetes:
      exclude: true   # k8s uses k8s/ingest-{clean,incremental}-job.yaml instead
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@perturbseqr-postgres/postgres?sslmode=disable
      - INGEST_S3_ENDPOINT
      - INGEST_S3_BUCKET
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      # Temporary AWS credentials only. Leave unset otherwise.
      - AWS_SESSION_TOKEN
      - ENRICH_URL=http://perturbseqr-enrich:8000
      - INGEST_CLEAN
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy
    entrypoint: ["/app/ingest-entrypoint.sh"]
    profiles: [jobs]

volumes:
  perturbseqr-data:
    x-kubernetes:
      size: 50Gi
      class: gp2

x-kubernetes:
  name: perturbseqr
  namespace: perturbseqr
