# NOTE: platform: linux/amd64 lines removed temporarily for local dev on ARM Mac.
# Restore them for production deployment:
#   platform: linux/amd64
services:
  perturbseek-app:
    build: .
    image: maayanlab/perturbseek:0.2.28
    x-kubernetes:
      imagePullPolicy: IfNotPresent
      annotations:
        maayanlab.cloud/ingress: https://perturbseek.maayanlab.cloud
    environment:
      - PUBLIC_URL=https://perturbseek.maayanlab.cloud
      - DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@perturbseek-postgres/$POSTGRES_DB
      - AUTHORIZATION_HEADER=$AUTHORIZATION_HEADER
      - NODE_ENV=production
      - ENRICH_URL=http://perturbseek-enrich:8000
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=$NEXT_PUBLIC_GA_MEASUREMENT_ID
    ports:
      - 3000:3000
  perturbseek-enrich:
    build: enrich
    image: maayanlab/perturbseek-enrich:0.2.09
    deploy:
      resources:
        reservations:
          memory: 5Gb
    environment:
      - 'ROCKET_DATABASES={postgres={url="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@perturbseek-postgres/${POSTGRES_DB}"}}'
    ports:
      - 8000:8000
  perturbseek-postgres:
    build: db
    image: maayanlab/perturbseek-postgres:0.0.1
    shm_size: 1Gb
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - ENRICH_URL=http://perturbseek-enrich:8000
    ports:
      - 5432:5432
    volumes:
      - perturbseek-data:/var/lib/postgresql/data

volumes:
  perturbseek-data:
    x-kubernetes:
      size: 50Gi
      class: gp2

x-kubernetes:
  name: perturbseek
  namespace: perturbseek
