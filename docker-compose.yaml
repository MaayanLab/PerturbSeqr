# PerturbSeek Docker Compose Configuration
#
# Persistent services: postgres, minio, enrich, app
# Job containers: minio-setup, dbmate, ingest (run with `docker compose run --rm <job>`)
#
# Usage:
#   docker compose up -d                          # Start persistent services
#   docker compose run --rm minio-setup           # Create bucket + set public policy
#   docker compose cp db/data/gmts perturbseqr-minio:/data/  # Copy GMT files to MinIO
#   docker compose run --rm ingest                # Run migrations + ingest data
#   docker compose down -v                        # Full reset (removes volumes)

services:
  # === Persistent Services ===

  perturbseqr-postgres:
    build: db
    image: johnkgardner/perturbseqr-postgres:${IMAGE_TAG:-0.0.1}
    shm_size: 1Gb
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - ENRICH_URL=http://perturbseqr-enrich:8000
    ports:
      - 5432:5432
    volumes:
      - perturbseqr-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  perturbseqr-minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - target: 9000
        published: 9000
        x-kubernetes:
          annotations:
            maayanlab.cloud/ingress: https://s3.perturbseqr.k8s.dev.maayanlab.cloud
      - target: 9001
        published: 9001
        x-kubernetes:
          annotations:
            maayanlab.cloud/ingress: https://console.s3.perturbseqr.k8s.dev.maayanlab.cloud
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  perturbseqr-enrich:
    build: enrich
    image: johnkgardner/perturbseqr-enrich:${IMAGE_TAG:-0.0.1}
    x-kubernetes:
      imagePullPolicy: Always
    deploy:
      resources:
        reservations:
          memory: 5Gb
    environment:
      - 'ROCKET_DATABASES={postgres={url="postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@perturbseqr-postgres/${POSTGRES_DB:-postgres}"}}'
    ports:
      - 8000:8000
    volumes:
      - enrich-data:/data
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy

  perturbseqr-app:
    build: .
    image: johnkgardner/perturbseqr-app:${IMAGE_TAG:-0.0.1}
    x-kubernetes:
      imagePullPolicy: Always
    environment:
      - PUBLIC_URL=https://perturbseqr.k8s.dev.maayanlab.cloud
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@perturbseqr-postgres/${POSTGRES_DB:-postgres}
      - AUTHORIZATION_HEADER=$AUTHORIZATION_HEADER
      - NODE_ENV=production
      - ENRICH_URL=http://perturbseqr-enrich:8000
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=$NEXT_PUBLIC_GA_MEASUREMENT_ID
      - NEXT_PUBLIC_MINIO_URL=${NEXT_PUBLIC_MINIO_URL:-https://s3.perturbseqr.k8s.dev.maayanlab.cloud}
      - MINIO_ENDPOINT=perturbseqr-minio:9000
    ports:
      - target: 3000
        published: 3000
        x-kubernetes:
          annotations:
            maayanlab.cloud/ingress: perturbseqr.k8s.dev.maayanlab.cloud
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy

  # === Job Containers (run with `docker compose run --rm <job>`) ===

  minio-setup:
    build: minio
    image: johnkgardner/perturbseqr-minio-setup:${IMAGE_TAG:-0.0.1}
    environment:
      - S3_URL=http://${MINIO_ROOT_USER:-minio}:${MINIO_ROOT_PASSWORD}@perturbseqr-minio:9000/gmts
      - PUBLIC_S3_URL=${NEXT_PUBLIC_MINIO_URL:-http://localhost:9000}/gmts
    depends_on:
      perturbseqr-minio:
        condition: service_healthy
    profiles: [jobs]

  dbmate:
    image: ghcr.io/amacneil/dbmate
    volumes:
      - ./db/migrations:/db/migrations:ro
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@perturbseqr-postgres/${POSTGRES_DB:-postgres}?sslmode=disable
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy
    command: ["up"]
    profiles: [jobs]

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: johnkgardner/perturbseqr-ingest:${IMAGE_TAG:-0.0.1}
    x-kubernetes:
      imagePullPolicy: Always
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@perturbseqr-postgres/${POSTGRES_DB:-postgres}?sslmode=disable
      - MINIO_ENDPOINT=perturbseqr-minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - ENRICH_URL=http://perturbseqr-enrich:8000
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy
      perturbseqr-minio:
        condition: service_healthy
    entrypoint: ["/app/ingest-entrypoint.sh"]
    profiles: [jobs]

volumes:
  perturbseqr-data:
    x-kubernetes:
      size: 50Gi
      class: local-path
  enrich-data:
    x-kubernetes:
      size: 10Gi
      class: local-path
  minio-data:
    x-kubernetes:
      size: 5Gi
      class: local-path

x-kubernetes:
  name: perturbseqr
  namespace: johnkgardner
