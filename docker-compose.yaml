# NOTE: platform: linux/amd64 lines removed temporarily for local dev on ARM Mac.
# Restore them for production deployment:
#   platform: linux/amd64
services:
  perturbseqr-app:
    build: .
    image: ghcr.io/maayanlab/perturbseqr-app:${IMAGE_TAG:-0.0.1}
    x-kubernetes:
      imagePullPolicy: IfNotPresent
      annotations:
        maayanlab.cloud/ingress: https://perturbseqr.dev.maayanlab.cloud
    environment:
      - PUBLIC_URL=https://perturbseqr.dev.maayanlab.cloud
      - DATABASE_URL=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@perturbseqr-postgres/$POSTGRES_DB
      - AUTHORIZATION_HEADER=$AUTHORIZATION_HEADER
      - NODE_ENV=production
      - ENRICH_URL=http://perturbseqr-enrich:8000
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=$NEXT_PUBLIC_GA_MEASUREMENT_ID
    ports:
      - 3000:3000
  perturbseqr-enrich:
    build: enrich
    image: ghcr.io/maayanlab/perturbseqr-enrich:${IMAGE_TAG:-0.0.1}
    deploy:
      resources:
        reservations:
          memory: 5Gb
    environment:
      - 'ROCKET_DATABASES={postgres={url="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@perturbseqr-postgres/${POSTGRES_DB}"}}'
    ports:
      - 8000:8000
  perturbseqr-postgres:
    build: db
    image: ghcr.io/maayanlab/perturbseqr-postgres:${IMAGE_TAG:-0.0.1}
    shm_size: 1Gb
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - ENRICH_URL=http://perturbseqr-enrich:8000
    ports:
      - 5432:5432
    volumes:
      - perturbseqr-data:/var/lib/postgresql/data

volumes:
  perturbseqr-data:
    x-kubernetes:
      size: 10Gi

x-kubernetes:
  name: perturbseqr
  namespace: johnkgardner
