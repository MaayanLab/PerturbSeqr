[project]
name = "perturbseqr-etl"
version = "0.0.0"
description = "PerturbSeqr ETL: build canonical GMTs and lookups from upstream datasets into the top-level data/ dir."
requires-python = ">=3.11"
dependencies = [
    "maayanlab-bioinformatics",
    "pandas",
    "pyarrow",
    "GEOparse",
    "tqdm",
    "requests",
    "perturbseqr-ingest",
    "polars>=1.0",        # Tahoe-100M pseudobulk DE scan (data_sources/tahoe_100m/gmt.py)
    "huggingface_hub",    # Tahoe-100M HuggingFace parquet downloads (data_sources/tahoe_100m/gmt.py)
    "pubchempy",          # PubChem name→CID + canonical name + synonyms (metadata_sources/pubchem)
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["perturbseqr_etl*"]

[tool.uv.sources]
perturbseqr-ingest = { path = "../ingest", editable = true }
maayanlab-bioinformatics = { git = "https://github.com/MaayanLab/maayanlab-bioinformatics.git", branch = "python3.14-compat" }
