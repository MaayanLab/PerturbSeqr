services:
  perturbseqr-postgres:
    platform: linux/arm64
    build:
      platforms:
        - linux/arm64
  perturbseqr-minio:
    # The Docker Hub mirror is amd64-only; use the locally cached ARM64 image.
    image: quay.io/minio/minio
    platform: linux/arm64
  perturbseqr-enrich:
    platform: linux/arm64
    build:
      platforms:
        - linux/arm64
    deploy:
      resources:
        reservations:
          memory: 10Gb
  perturbseqr-app:
    platform: linux/arm64
    build:
      platforms:
        - linux/arm64
  perturbseqr-mcp:
    platform: linux/arm64
    build:
      platforms:
        - linux/arm64
  minio-setup:
    platform: linux/arm64
    build:
      platforms:
        - linux/arm64
  ingest:
    platform: linux/arm64
    build:
      platforms:
        - linux/arm64
