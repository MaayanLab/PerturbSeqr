services:
  perturbseqr-postgres:
    build: db
    image: johnkgardner/perturbseqr-postgres:0.2.45
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 1Gb
    environment:
      - POSTGRES_PASSWORD
      - ENRICH_URL=http://perturbseqr-enrich:8000
    ports:
      - 5432:5432
    volumes:
      - perturbseqr-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  perturbseqr-minio:
    image: quay.io/minio/minio
    pull_policy: missing
    platform: linux/amd64
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD
    ports:
      - target: 9000
        published: 9000
        x-kubernetes:
          annotations:
            maayanlab.cloud/ingress: https://s3.perturbseqr.k8s.maayanlab.cloud
      - target: 9001
        published: 9001
        x-kubernetes:
          annotations:
            maayanlab.cloud/ingress: https://console.s3.perturbseqr.k8s.maayanlab.cloud
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  perturbseqr-enrich:
    build: enrich
    image: johnkgardner/perturbseqr-enrich:0.2.51
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 5Gb
    environment:
      - ROCKET_DATABASES={postgres={url="postgres://postgres:${POSTGRES_PASSWORD}@perturbseqr-postgres/postgres"}}
      - MINIO_ENDPOINT=perturbseqr-minio:9000
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD
      - MINIO_SECURE=false
    ports:
      - 8000:8000
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy
      perturbseqr-minio:
        condition: service_healthy

  perturbseqr-app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_MINIO_URL=https://s3.perturbseqr.k8s.maayanlab.cloud/data
    image: johnkgardner/perturbseqr-app:0.2.52-dev
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - PUBLIC_URL=https://perturbseqr.k8s.maayanlab.cloud
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@perturbseqr-postgres/postgres
      - NODE_ENV=production
      - ENRICH_URL=http://perturbseqr-enrich:8000
      - NEXT_PUBLIC_MINIO_URL=https://s3.perturbseqr.k8s.maayanlab.cloud/data
      - MINIO_ENDPOINT=perturbseqr-minio:9000
    ports:
      - target: 3000
        published: 3000
        x-kubernetes:
          annotations:
            maayanlab.cloud/ingress: https://perturbseqr.k8s.maayanlab.cloud
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy

  perturbseqr-mcp:
    build: mcp
    image: johnkgardner/perturbseqr-mcp:0.2.51
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - PERTURBSEQR_API_URL=http://perturbseqr-app:3000/graphql
    ports:
      - 5000:5000
    x-kubernetes:
      annotations:
        maayanlab.cloud/ingress: https://perturbseqr.k8s.maayanlab.cloud/mcp
    depends_on:
      - perturbseqr-app

  minio-setup:
    build: minio
    image: johnkgardner/perturbseqr-minio-setup:0.2.45
    platform: linux/amd64
    restart: "no"
    x-kubernetes:
      exclude: true   # k8s uses k8s/minio-setup-job.yaml instead
    environment:
      - S3_URL=http://minio:${MINIO_ROOT_PASSWORD}@perturbseqr-minio:9000/data
      - PUBLIC_S3_URL=https://s3.perturbseqr.k8s.maayanlab.cloud/data
    depends_on:
      perturbseqr-minio:
        condition: service_healthy
    profiles: [jobs]

  dbmate:
    image: ghcr.io/amacneil/dbmate
    restart: "no"
    volumes:
      - ./db/migrations:/db/migrations:ro
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@perturbseqr-postgres/postgres?sslmode=disable
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy
    command: ["up"]
    profiles: [jobs]

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: johnkgardner/perturbseqr-ingest:0.2.51
    platform: linux/amd64
    restart: "no"
    x-kubernetes:
      exclude: true   # k8s uses k8s/ingest-{clean,incremental}-job.yaml instead
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@perturbseqr-postgres/postgres?sslmode=disable
      - MINIO_ENDPOINT=perturbseqr-minio:9000
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD
      - MINIO_SECURE=false
      - ENRICH_URL=http://perturbseqr-enrich:8000
      - INGEST_CLEAN
    depends_on:
      perturbseqr-postgres:
        condition: service_healthy
      perturbseqr-minio:
        condition: service_healthy
    entrypoint: ["/app/ingest-entrypoint.sh"]
    profiles: [jobs]

volumes:
  perturbseqr-data:
    x-kubernetes:
      size: 50Gi
      class: ceph-block
  minio-data:
    x-kubernetes:
      size: 50Gi
      class: ceph-block-no-replicas

x-kubernetes:
  name: perturbseqr
  namespace: johnkgardner
