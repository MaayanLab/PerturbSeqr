[project]
name = "perturbseqr-ingest"
version = "0.0.0"
description = "PerturbSeqr data ingest runtime: load GMTs and metadata into Postgres."
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "psycopg2-binary",
    "polars",
    "tqdm",
    "requests",
    "urllib3",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["perturbseqr_ingest"]
