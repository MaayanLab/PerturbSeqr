# Local-only override for keeping enrichment backups in the existing MinIO store.
services:
  perturbseqr-minio:
    image: johnkgardner/perturbseqr-minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: missing
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    x-kubernetes:
      exclude: true

  perturbseqr-enrich:
    environment:
      ENRICH_S3_ENDPOINT: ""
      ENRICH_S3_BUCKET: ""
      ENRICH_S3_PREFIX: enrich/
      MINIO_ENDPOINT: perturbseqr-minio:9000
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_SECURE: "false"
    depends_on:
      perturbseqr-minio:
        condition: service_healthy

volumes:
  minio-data:
