query Stats {
  userGeneSets {
    totalCount
  }
  geneSets {
    totalCount
  }
}

query FetchUserGeneSet($id: UUID!) {
  userGeneSet(id: $id) {
    genes
    description
  }
}

# EnrichmentQuery: Main enrichment analysis query
# Input:
#   - genes: Array of gene symbols to analyze
#   - filterTerm: Optional term filter for results
#   - libraryNames: Optional array of library names to filter results (null = all libraries)
#   - offset, first: Pagination parameters
#   - filterFda, filterKo: Boolean filters
#   - sortBy: Sort field
#   - topN: Top N results for consensus
#   - pvalueLe: P-value threshold
# Output: Enrichment results with gene sets, consensus, and MoAs
query EnrichmentQuery($genes: [String]!, $filterTerm: String = "", $libraryNames: [String], $offset: Int = 0, $first: Int = 10, $filterFda: Boolean = false, $sortBy: String = "", $filterKo: Boolean = false, $topN: Int = 10000, $pvalueLe: Float = 0.05, $postSearchFilterLibraryNames: [String], $filterCellLine: String, $filterTimepoint: String, $filterConcentration: String) {
  currentBackground {
    enrich(
      genes: $genes
      filterTerm: $filterTerm
      libraryNames: $libraryNames
      offset: $offset
      first: $first
      filterFda: $filterFda
      sortby: $sortBy
      filterKo: $filterKo
      topN: $topN
      pvalueLe: $pvalueLe
      postSearchFilterLibraryNames: $postSearchFilterLibraryNames
      filterCellLine: $filterCellLine
      filterTimepoint: $filterTimepoint
      filterConcentration: $filterConcentration
    ) {
      nodes {
        geneSetHash
        pvalue
        adjPvalue
        oddsRatio
        nOverlap
        geneSets {
          nodes {
            id
            term
            description
            nGeneIds
            library {
              name
            }
            geneSetFdaCountsById {
              nodes {
                approved
                count
                moa
              }
            }
          }
          totalCount
        }
      }
      totalCount
      consensusCount
      moasCount
      geneSetCount
      consensus {
        drug
        cid
        oddsRatio
        pvalue
        adjPvalue
        approved
        countSignificant
        countInsignificant
        countUpSignificant
        pvalueUp
        adjPvalueUp
        oddsRatioUp
        pvalueDown
        adjPvalueDown
        oddsRatioDown
        libraries
        contributingSignatures
      }
      moas {
        drug
        cid
        oddsRatio
        pvalue
        adjPvalue
        approved
        countSignificant
        countInsignificant
        countUpSignificant
        pvalueUp
        adjPvalueUp
        oddsRatioUp
        pvalueDown
        adjPvalueDown
        oddsRatioDown
        libraries
        contributingSignatures
      }
    }
  }
}

