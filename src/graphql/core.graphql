        drug
        cid
        oddsRatio
        pvalue
        adjPvalue
        approved
        countSignificant
        countInsignificant
        countUpSignificant
        pvalueUp
        adjPvalueUp
        oddsRatioUp
        pvalueDown
        adjPvalueDown
        oddsRatioDown
        libraries
        contributingSignatures
      }
