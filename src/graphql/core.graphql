# AllLibraries: Fetch all available gene set libraries for filtering
# Input: None
# Output: List of library nodes with id, name, and gene set count
query AllLibraries {
  geneSetLibraries {
    nodes {
      id
      name
      geneSetsByLibraryId {
        totalCount
      }
    }
  }
}

# Gene search: find all genesets containing certain gene(s)
# Input:
#   - genes: Array of gene symbols to search for
#   - libraryNames: Optional array of library names to filter results (null = all libraries)
#   - offset: Pagination offset (default 0)
#   - first: Number of results to return (default 10)
# Output: Gene set nodes with term, and total count
query GeneSearch($genes: [String]!, $libraryNames: [String], $offset: Int = 0, $first: Int = 10) {
  geneSetGeneSearch(genes: $genes, libraryNames: $libraryNames, offset: $offset, first: $first) {
    nodes {
      term
    }
    totalCount
  }
}

# Term search: find all genesets containing certain term(s)
# Input:
#   - terms: Array of search terms to match against gene set terms
#   - libraryNames: Optional array of library names to filter results (null = all libraries)
#   - offset: Pagination offset (default 0)
#   - first: Number of results to return (default 10)
# Output: Gene set nodes with id, term, nGeneIds, and total count
query TermSearch($terms: [String]!, $libraryNames: [String], $offset: Int = 0, $first: Int = 10) {
  geneSetTermSearch(terms: $terms, libraryNames: $libraryNames, offset: $offset, first: $first) {
    nodes {
      id
      term
      nGeneIds
      library {
        name
      }
    }
    totalCount
  }
}

mutation AddUserGeneSet($genes: [String], $description: String = "") {
  addUserGeneSet(input: {genes: $genes, description: $description}) {
    userGeneSet {
      id
    }
  }
}

# GeneSetGenesById (previously ViewGeneSet)
# Lookup: by UUID
# Input: id (UUID) - the unique identifier of the gene set
# Output: genes only - list of gene symbols, NCBI IDs, descriptions, summaries
# Use case: When you only need the gene list, not the gene set metadata
query GeneSetGenesById($id: UUID!) {
  geneSet(id: $id) {
    genes {
      nodes {
        symbol
        ncbiGeneId
        description
        summary
      }
    }
  }
}

# GeneSetDetailsById (previously ViewGeneSet2)
# Lookup: by UUID
# Input: id (UUID) - the unique identifier of the gene set
# Output: term, description, and full gene list with details
# Use case: When you need complete gene set info including metadata
query GeneSetDetailsById($id: UUID!) {
  geneSet(id: $id) {
    term
    description
    genes {
      nodes {
        symbol
        ncbiGeneId
        description
        summary
      }
    }
  }
}

# GeneSetDetailsByTerm (previously ViewGeneSet3)
# Lookup: by term string (requires UNIQUE constraint on term column)
# Input: term (String) - the human-readable term like "VCAP-vorinostat-10uM-24h-up"
# Output: term, description, and full gene list with details
# Use case: URL-friendly lookups, external service submissions (Enrichr, PWB, etc.)
query GeneSetDetailsByTerm($term: String!) {
  geneSetByTerm(term: $term) {
    term
    description
    genes {
      nodes {
        symbol
        ncbiGeneId
        description
        summary
      }
    }
  }
}

query OverlapQuery($id: UUID!, $genes: [String]!) {
  geneSet(id: $id) {
    overlap(genes: $genes) {
      nodes {
        symbol
        ncbiGeneId
        description
        summary
      }
    }
  }
}

query FetchGeneInfo($genes: [String]!) {
  geneMap2(genes: $genes) {
    nodes {
      gene
      geneInfo {
        symbol
        ncbiGeneId
        description
        summary
      }
    }
  }
}

query LatestRelease {
  releases(orderBy: CREATED_DESC, first: 1) {
    nodes {
      created
    }
  }
}

# TermSearchGeneSets: Search gene sets by term with full gene data
# Input:
#   - filterTerm: Array of search terms to match against gene set terms
#   - libraryNames: Optional array of library names to filter results (null = all libraries)
# Output: Gene set nodes with term and nested genes, total count, and pagination info
query TermSearchGeneSets($filterTerm: [String]!, $libraryNames: [String]) {
  geneSetTermSearch(terms: $filterTerm, libraryNames: $libraryNames) {
    nodes {
      term
      genes {
        nodes {
          symbol
        }
      }
    }
    totalCount
    pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
  }

}
