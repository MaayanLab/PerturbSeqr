name: Build App Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: '0.2.53'
      environment:
        description: 'Which image(s) to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - dev
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image (prod)
        if: inputs.environment == 'prod' || inputs.environment == 'both'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_MINIO_URL=https://s3.perturbseqr.maayanlab.cloud/data
          tags: |
            ghcr.io/maayanlab/perturbseqr-app:${{ github.event.inputs.tag }}
            johnkgardner/perturbseqr-app:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push app image (dev)
        if: inputs.environment == 'dev' || inputs.environment == 'both'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_MINIO_URL=https://s3.perturbseqr.k8s.maayanlab.cloud/data
          tags: |
            ghcr.io/maayanlab/perturbseqr-app:${{ github.event.inputs.tag }}-dev
            johnkgardner/perturbseqr-app:${{ github.event.inputs.tag }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
