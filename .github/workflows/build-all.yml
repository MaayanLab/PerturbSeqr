name: Build All Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: '0.2.52'

jobs:
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_MINIO_URL=https://perturbseqr.s3.amazonaws.com
          tags: |
            ghcr.io/maayanlab/perturbseqr-app:${{ github.event.inputs.tag }}
            johnkgardner/perturbseqr-app:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push app image (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_MINIO_URL=https://s3.perturbseqr.k8s.maayanlab.cloud/data
          tags: |
            ghcr.io/maayanlab/perturbseqr-app:${{ github.event.inputs.tag }}-dev
            johnkgardner/perturbseqr-app:${{ github.event.inputs.tag }}-dev

  build-enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push enrich image
        uses: docker/build-push-action@v5
        with:
          context: ./enrich
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/maayanlab/perturbseqr-enrich:${{ github.event.inputs.tag }}
            johnkgardner/perturbseqr-enrich:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/maayanlab/perturbseqr-mcp:${{ github.event.inputs.tag }}
            johnkgardner/perturbseqr-mcp:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-db:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push db image
        uses: docker/build-push-action@v5
        with:
          context: ./db
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/maayanlab/perturbseqr-postgres:${{ github.event.inputs.tag }}
            johnkgardner/perturbseqr-postgres:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ingest image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ingest/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/maayanlab/perturbseqr-ingest:${{ github.event.inputs.tag }}
            johnkgardner/perturbseqr-ingest:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-minio-setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push minio-setup image
        uses: docker/build-push-action@v5
        with:
          context: ./minio
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/maayanlab/perturbseqr-minio-setup:${{ github.event.inputs.tag }}
            johnkgardner/perturbseqr-minio-setup:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
