# Incremental ingest. Skips existing gene sets by hash; only adds new rows.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: ingest-incremental-
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 43200  # 12 hours
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: ingest
        image: johnkgardner/perturbseqr-ingest:0.2.54
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: POSTGRES_PASSWORD } }
        - name: MINIO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: MINIO_ROOT_PASSWORD, optional: true } }
        - name: DATABASE_URL
          value: postgres://postgres:$(POSTGRES_PASSWORD)@perturbseqr-postgres/postgres?sslmode=disable
        - { name: MINIO_ENDPOINT, value: perturbseqr-minio:9000 }
        - { name: MINIO_ROOT_USER, value: minio }
        - { name: MINIO_SECURE,    value: "false" }
        - name: INGEST_S3_ENDPOINT
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: INGEST_S3_ENDPOINT, optional: true } }
        - name: INGEST_S3_BUCKET
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: INGEST_S3_BUCKET, optional: true } }
        - name: AWS_REGION
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: AWS_REGION, optional: true } }
        - name: AWS_DEFAULT_REGION
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: AWS_DEFAULT_REGION, optional: true } }
        - name: AWS_ACCESS_KEY_ID
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: AWS_ACCESS_KEY_ID, optional: true } }
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: AWS_SECRET_ACCESS_KEY, optional: true } }
        - name: AWS_SESSION_TOKEN
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: AWS_SESSION_TOKEN, optional: true } }
        - { name: ENRICH_URL,      value: http://perturbseqr-enrich:8000 }
        - { name: INGEST_CLEAN,    value: "false" }
