# Apply MinIO bucket policy (creates bucket if missing, denies public access to enrich/*).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: minio-setup-
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: minio-setup
        image: johnkgardner/perturbseqr-minio-setup:0.2.36
        env:
        - name: S3_URL
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: PROD_S3_URL } }
        - name: PUBLIC_S3_URL
          valueFrom: { secretKeyRef: { name: perturbseqr-env, key: PROD_PUBLIC_S3_URL } }
